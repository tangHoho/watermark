<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>浮水印印</title>
<meta name="theme-color" content="#141214">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="浮水印印">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@700&family=LXGW+WenKai+TC&family=Pacifico&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
/* VOICE: playful pocket tool for friends, quick and confident
   IDEA: a phone photo-editor — picture fills the screen, icon tools in a dock under the thumb
   PICTURE: the user's own photo/video, large, with the draggable mark on top
   COLOUR and TYPE: charcoal ground, warm coral accent, Noto Sans TC
   LAYOUT: fixed full-height app, no page scroll; icon tab dock on phone, side panel above 900px */
:root{color-scheme:light dark;--bg:light-dark(#f4f1ee,#141214);--pane:light-dark(#ffffff,#1f1c1f);--line:light-dark(#e2dcd6,#363036);--ink:light-dark(#1b1719,#f3eeea);--mute:light-dark(#6f666b,#a59ca1);--acc:#ff6b4a;--acc2:light-dark(#ffe3da,#3a2420);--stage:light-dark(#2a2629,#0b0a0b)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans TC",system-ui,sans-serif;display:flex;flex-direction:column;height:100dvh;overflow:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);-webkit-tap-highlight-color:transparent}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.s{width:16px;height:16px}
header{display:flex;align-items:center;gap:6px;padding:6px 8px;flex:none}
#ver{font-size:11px;color:var(--mute);margin-right:auto;padding-left:4px}
body.start header{position:fixed;top:env(safe-area-inset-top);left:0;right:0;z-index:2;pointer-events:none}body.start header>*{pointer-events:auto}
button,.btn{font:inherit;font-size:15px;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--pane);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;position:relative;white-space:nowrap}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,textarea:focus-visible,.btn:focus-within{outline:3px solid var(--acc);outline-offset:-3px}
.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.on{background:var(--acc2);border-color:var(--acc);color:var(--ink)}
.ib{width:44px;padding:0}
.btn input{position:absolute;opacity:0;width:1px;height:1px}
.hide{display:none!important}
.row-scroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:6px 12px}
.row-scroll::-webkit-scrollbar{display:none}
/* empty */
#empty{flex:1;margin:44px 12px calc(12px + env(safe-area-inset-bottom));border:2.5px dashed var(--line);border-radius:24px;display:grid;place-items:center;cursor:pointer;position:relative;transition:border-color .2s,background .2s}
#empty:hover,#empty.drag,#empty:focus-within{border-color:var(--acc);background:var(--acc2)}
#empty .plus{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:var(--pane);border:1px solid var(--line);color:var(--acc)}
#empty .plus svg{width:40px;height:40px;stroke-width:2.2}
#empty input{position:absolute;opacity:0;width:1px;height:1px}
/* app */
#app{flex:1;min-height:0;display:flex;flex-direction:column}
#strip{flex:none;padding-top:0;padding-bottom:8px}
.th{flex:none;width:52px;height:52px;min-height:0;border-radius:10px;overflow:hidden;border:0;padding:0;background:var(--stage);position:relative;box-shadow:0 0 0 2px transparent}
.th.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--acc)}
.th img,.th video{width:100%;height:100%;object-fit:cover;pointer-events:none;display:block}
.th .vt{position:absolute;left:3px;bottom:3px;width:16px;height:16px;border-radius:4px;background:#000a;color:#fff;display:grid;place-items:center}
.th .vt svg{width:10px;height:10px;fill:#fff;stroke:none}
.th .x{position:absolute;top:0;right:0;width:22px;height:22px;background:#000b;color:#fff;display:grid;place-items:center;border-bottom-left-radius:8px}
.th .x svg{width:12px;height:12px}
#stage{flex:1;min-height:120px;background:var(--stage);display:grid;place-items:center;overflow:hidden;touch-action:none;position:relative;margin:0}
#cv{touch-action:none;cursor:grab;display:block}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;font-size:13px;color:#fff;background:#000a;padding:4px 12px;border-radius:99px;pointer-events:none;white-space:nowrap;transition:opacity .4s;display:flex;gap:6px;align-items:center}
#dock{flex:none;padding:2px 0 env(safe-area-inset-bottom)}
#chips>*{flex:none;font-size:14px;min-height:38px;padding:0 12px;border-radius:99px}
#chips .add{color:var(--acc);border-style:dashed}
#pane{height:150px;overflow-y:auto;padding:4px 12px}
.sec{display:none;gap:10px;align-content:start}.sec.show{display:grid}
#tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--line)}
#tabs button{border:0;border-radius:0;background:none;min-height:56px;font-size:11px;color:var(--mute);padding:4px 0 2px;flex-direction:column;gap:2px}
#tabs button.on{color:var(--acc);font-weight:700}
textarea{font:inherit;font-size:16px;width:100%;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--pane);color:var(--ink);resize:none;height:56px;display:block}
.sw{margin:0 -12px}
.sw button,.sw label{flex:none;width:34px;height:34px;min-height:0;border-radius:50%;padding:0;border:1px solid #8884}
.sw .on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--acc)}
.sw label{background:conic-gradient(#f44,#fd4,#4e8,#4cf,#64f,#e4c,#f44)}
.fonts{margin:0 -12px}
.fonts button{flex:none;flex-direction:column;gap:0;height:84px;width:84px;font-size:20px;line-height:1.25;padding:0}
.fonts small{font:11px "Noto Sans TC",sans-serif;color:var(--mute)}
.sl{display:grid;grid-template-columns:28px minmax(0,1fr) 64px 14px;align-items:center;gap:10px;height:40px;font-size:14px;color:var(--mute)}
.num{font:inherit;font-size:16px;width:100%;height:36px;padding:0 6px;border-radius:10px;border:1px solid var(--line);background:var(--pane);color:var(--ink);text-align:center;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.num::-webkit-inner-spin-button,.num::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.num:focus-visible{outline:3px solid var(--acc);outline-offset:-3px}
.sl .u{font-size:13px}
input[type=range]{width:100%;accent-color:var(--acc);height:32px;margin:0}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tiles button{flex-direction:column;gap:4px;height:72px;font-size:12px;padding:0}
.posw{display:flex;gap:14px;align-items:flex-start}
.grid9{display:grid;grid-template-columns:repeat(3,44px);gap:4px;padding:6px;border:1px solid var(--line);border-radius:14px;background:var(--bg)}
.grid9 button{padding:0;min-height:0;height:36px;width:44px;border-radius:8px;position:relative;background:var(--pane)}
.grid9 button::after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:var(--mute);left:var(--x);top:var(--y);transform:translate(-50%,-50%)}
.grid9 button:hover::after,.grid9 button:active::after{background:var(--acc)}
.posw .side{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;flex:1}
.posw .side button{flex-direction:column;gap:4px;height:72px;font-size:12px;padding:0}
.note{font-size:13px;color:var(--mute);margin:0}
@media(min-width:900px){
  #app{display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:auto minmax(0,1fr);padding-bottom:12px}
  #strip{grid-column:1/-1}
  #stage{margin:0 0 0 12px;border-radius:16px}
  #dock{background:var(--pane);border:1px solid var(--line);border-radius:16px;margin:4px 12px 0;overflow-y:auto;padding:8px 0}
  #tabs{display:none}#pane{height:auto;overflow:visible}
  .sec{display:grid!important;padding:12px 0;border-bottom:1px solid var(--line)}
  .sec::before{content:attr(data-n);font-weight:700;font-size:14px}
}
/* export overlay */
#ov{position:fixed;inset:0;background:#000b;display:none;place-items:center;padding:16px;z-index:9}
#ov.show{display:grid}
.card{background:var(--pane);border-radius:20px;padding:18px;width:min(460px,100%);display:grid;gap:12px;max-height:90dvh;overflow:auto}
.card h2{margin:0;font-size:20px}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
.list{display:grid;gap:10px}
.it{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center}
.it .th{width:48px;height:48px}
.it b{font-weight:500;font-size:14px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it small{font-size:12px;color:var(--mute)}
.it .ok{color:#1f9d55}.it .bad{color:#d93b2b}
.acts{display:flex;gap:10px;flex-wrap:wrap}.acts>*{flex:1}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10;white-space:nowrap}
#toast.show{opacity:1}
</style>
</head>

<header>
  <small id="ver"></small>
  <button class="hide" id="inst" aria-label="安裝成 App"><svg class="ic"><use href="#i-phone"/></svg>安裝</button>
  <button class="ib hide" id="undo" aria-label="上一步" title="上一步" disabled><svg class="ic"><use href="#i-undo"/></svg></button>
  <button class="ib hide" id="redo" aria-label="下一步" title="下一步" disabled><svg class="ic"><use href="#i-redo"/></svg></button>
  <label class="btn ib hide" id="addb" aria-label="加入更多檔案" title="加入更多檔案"><svg class="ic"><use href="#i-addimg"/></svg><input type="file" accept="image/*,video/*,.heic,.heif" multiple id="f2"></label>
  <button class="pri hide" id="go"><svg class="ic"><use href="#i-export"/></svg><span id="goT">輸出</span></button>
</header>

<label id="empty" aria-label="選擇照片或影片">
  <span class="plus"><svg class="ic"><use href="#i-plus"/></svg></span>
  <input type="file" accept="image/*,video/*,.heic,.heif" multiple id="f1">
</label>

<main id="app" class="hide">
  <div id="strip" class="row-scroll"></div>
  <div id="stage"><canvas id="cv"></canvas><span id="hint"><svg class="ic s"><use href="#i-hand"/></svg>拖曳移動 · 兩指縮放旋轉 · 點兩下改字</span></div>
  <div id="dock">
    <div id="chips" class="row-scroll"></div>
    <div id="pane">
      <div class="sec" data-t="text" data-n="文字">
        <textarea id="text" rows="2" placeholder="輸入浮水印文字，可換行" aria-label="浮水印文字"></textarea>
        <div class="sw row-scroll" id="sw"></div>

<script>
{
const VERSION='1.5.2';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const ic=(n,c='')=>`<svg class="ic ${c}"><use href="#i-${n}"/></svg>`;
const cv=$('#cv'),cx=cv.getContext('2d');
const FONTS=[['Noto Sans TC','黑體',900],['Noto Serif TC','明體',700],['LXGW WenKai TC','楷書',400],['Pacifico','Script',400],['Bebas Neue','Bebas',400]];
const COLORS=['#ffffff','#000000','#ff6b4a','#ffd166','#06d6a0','#4cc9f0','#c77dff'];
let items=[],cur=null,layers=[],act=0,dl=null,busy=false,tab='text',cancel=false,guide={x:false,y:false};
const newText=()=>({k:'t',text:'© HoHo',font:0,color:'#ffffff',size:.07,op:.85,rot:0,x:.8,y:.92,shadow:true,stroke:false,box:false,tile:false});
const newImg=(img,src)=>({k:'i',img,src,size:.25,op:.9,rot:0,x:.84,y:.1,shadow:false,tile:false});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('#ver').textContent='v'+VERSION;

try{if(window.claude&&claude.use)claude.use('downloads').then(d=>{dl=d}).catch(()=>{})}catch(e){}
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2200)};
const fontStr=(L,px)=>`${FONTS[L.font][2]} ${px}px "${FONTS[L.font][0]}", "Noto Sans TC", sans-serif`;

/* ---------- drawing (shared by preview and export) ---------- */
function dims(c,L,W,H){
  const m=Math.min(W,H);
  if(L.k==='i'){const w=L.size*m*2,h=w*(L.img.naturalHeight/L.img.naturalWidth||1);return{w,h}}
  const px=Math.max(4,L.size*m),lines=String(L.text||' ').split('\n');
  c.font=fontStr(L,px);
  const w=Math.max(...lines.map(s=>c.measureText(s).width))+(L.box?px*.9:0);
  return{w:Math.max(w,px*.6),h:lines.length*px*1.25+(L.box?px*.5:0),px,lines};
}
function paint(c,L,d,m){
  if(L.shadow){c.shadowColor='rgba(0,0,0,.55)';c.shadowBlur=m*.012;c.shadowOffsetY=m*.004}
  if(L.k==='i'){if(L.img.complete&&L.img.naturalWidth)c.drawImage(L.img,-d.w/2,-d.h/2,d.w,d.h);return}
  if(L.box){c.save();c.shadowColor='transparent';c.fillStyle='rgba(0,0,0,.45)';c.beginPath();c.roundRect(-d.w/2,-d.h/2,d.w,d.h,d.px*.3);c.fill();c.restore()}
  c.font=fontStr(L,d.px);c.textAlign='center';c.textBaseline='middle';
  const lh=d.px*1.25,y0=-(d.lines.length-1)*lh/2;
  const light=parseInt(L.color.slice(1,3),16)+parseInt(L.color.slice(3,5),16)+parseInt(L.color.slice(5,7),16)>380;
  d.lines.forEach((s,i)=>{
    if(L.stroke){c.save();c.shadowColor='transparent';c.lineJoin='round';c.lineWidth=d.px*.14;c.strokeStyle=light?'#000':'#fff';c.strokeText(s,0,y0+i*lh);c.restore()}
    c.fillStyle=L.color;c.fillText(s,0,y0+i*lh);
  });
}
function drawLayer(c,L,W,H){
  const m=Math.min(W,H),d=dims(c,L,W,H);
  c.save();c.globalAlpha=L.op;
  if(L.tile){
    const gx=Math.max(d.w*1.5,m*.12),gy=Math.max(d.h*3,m*.1),R=Math.hypot(W,H)/2+gx;
    c.translate(W/2,H/2);c.rotate(L.rot*Math.PI/180);
    const ox=((L.x-.5)*W)%gx,oy=((L.y-.5)*H)%gy;let row=0,n=0;
    for(let y=-R;y<=R&&n<900;y+=gy,row++)for(let x=-R-(row%2?gx/2:0);x<=R&&n<900;x+=gx,n++){c.save();c.translate(x+ox,y+oy);paint(c,L,d,m);c.restore()}
  }else{c.translate(L.x*W,L.y*H);c.rotate(L.rot*Math.PI/180);paint(c,L,d,m)}
  c.restore();return d;
}

  const s=$('#stage'),dpr=Math.min(devicePixelRatio||1,2);

  cv.style.width=Math.round(cur.w*k)+'px';cv.style.height=Math.round(cur.h*k)+'px';
  cv.width=Math.max(1,Math.round(cur.w*k*dpr));cv.height=Math.max(1,Math.round(cur.h*k*dpr));render();
}
function render(){
  if(!cur||!cur.el)return;const W=cv.width,H=cv.height;
  cx.clearRect(0,0,W,H);cx.drawImage(cur.el,0,0,W,H);
  layers.forEach((L,i)=>{const d=drawLayer(cx,L,W,H);
    if(i===act&&!L.tile&&!busy){cx.save();cx.translate(L.x*W,L.y*H);cx.rotate(L.rot*Math.PI/180);cx.setLineDash([6,5]);cx.lineWidth=2;cx.strokeStyle='#ff6b4a';cx.strokeRect(-d.w/2-6,-d.h/2-6,d.w+12,d.h+12);cx.restore()}});
  if(drag&&(guide.x||guide.y)){cx.save();cx.strokeStyle='rgba(255,107,74,.9)';cx.lineWidth=1.5;cx.setLineDash([4,4]);cx.beginPath();
    if(guide.x){cx.moveTo(W/2,0);cx.lineTo(W/2,H)}if(guide.y){cx.moveTo(0,H/2);cx.lineTo(W,H/2)}cx.stroke();cx.restore()}
}

      v.onloadeddata=()=>{it.el=v;it.w=v.videoWidth;it.h=v.videoHeight;res(it)};v.onerror=()=>rej(new Error('影片格式讀不了'));v.src=it.url}

  });

  sc.onload=()=>window.heic2any?res(window.heic2any):rej(new Error('HEIC 轉換工具載入失敗'));sc.onerror=()=>{heicLib=null;rej(new Error('HEIC 轉換工具載入失敗，請確認有網路'))};document.head.append(sc)}))}

const ov=$('#ov'),card=$('#card');
async function expImage(it){

  g.drawImage(it.el,0,0);layers.forEach(l=>drawLayer(g,l,it.w,it.h));

}
function pickMime(){const list=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];

    try{await new Promise((r,j)=>{v.onloadeddata=r;v.onerror=()=>j(new Error('影片讀不了'));v.src=it.url})}catch(e){v.remove();return reject(e)}

    rec.onstop=()=>{cleanup();if(cancel)return reject(new Error('已取消'));const ext=mime.includes('mp4')?'mp4':'webm';resolve({blob:new Blob(chunks,{type:mime.split(';')[0]}),name:`${it.name}_浮水印.${ext}`,ext})};

      v.requestVideoFrameCallback?v.requestVideoFrameCallback(tick):requestAnimationFrame(tick)};
    v.onended=()=>{draw();setTimeout(()=>rec.state!=='inactive'&&rec.stop(),150)};
    rec.start(500);try{await v.play()}catch(e){rec.stop();return}tick();
  });
}
const size=b=>(b.size/1048576).toFixed(1)+' MB';
const thumb=it=>`<span class="th">${thumbInner(it)}</span>`;
function progressView(){
  const done=items.filter(i=>i.out||i.err).length;
  card.innerHTML=`<h2>正在加浮水印… ${done} / ${items.length}</h2><div class="prog"><i style="width:${(100*done/items.length).toFixed(0)}%"></i></div>
   ${items.some(i=>i.type==='video')?'<p class="note">影片會從頭播一次來錄製，請保持畫面開著、不要切換 App。</p>':''}
   <div class="list">${items.map((it,i)=>`<div class="it">${thumb(it)}<div><b>${esc(it.name)}</b><small id="st${i}" class="${it.out?'ok':it.err?'bad':''}">${it.out?'完成 · '+size(it.out.blob):it.err?it.err:it.busy?'處理中…':'等待中'}</small></div><span></span></div>`).join('')}</div>
   <button id="cancel">${ic('x')}取消</button>`;
  $('#cancel').onclick=()=>{cancel=true};
}
$('#go').addEventListener('click',async()=>{
  if(!items.length||busy)return;busy=true;cancel=false;render();if(cur&&cur.type==='video'&&cur.el)cur.el.pause();
  items.forEach(it=>{it.out=null;it.err=null;it.busy=false});
  await document.fonts.ready;ov.classList.add('show');progressView();
  for(let i=0;i<items.length&&!cancel;i++){const it=items[i];it.busy=true;progressView();
    try{it.out=it.type==='image'?await expImage(it):await expVideo(it,p=>{const e=$('#st'+i);if(e)e.textContent=`處理中 ${Math.round(p*100)}%`})}
    catch(e){it.err=e.message||'失敗'}
    it.busy=false;}
  resultView();
});
function close(){ov.classList.remove('show');busy=false;if(cur&&cur.type==='video'&&cur.el)cur.el.play().catch(()=>{});render()}
/* ---------- saving: chosen folder (File System Access), claude downloads, or browser download ---------- */
const fsa=(()=>{try{return 'showDirectoryPicker' in window&&window.self===window.top}catch(e){return false}})();
let saveDir=null;
const idb=(mode,fn)=>new Promise((res,rej)=>{const r=indexedDB.open('wm',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');
  r.onsuccess=()=>{const tx=r.result.transaction('kv',mode),q=fn(tx.objectStore('kv'));tx.oncomplete=()=>res(q&&q.result);tx.onerror=()=>rej(tx.error)};r.onerror=()=>rej(r.error)});
if(fsa)idb('readonly',st=>st.get('dir')).then(d=>{if(d)saveDir=d}).catch(()=>{});
async function getDir(pick){
  let d=pick?null:saveDir;
  if(d){let p='prompt';try{p=d.queryPermission?await d.queryPermission({mode:'readwrite'}):'prompt';if(p!=='granted')p=await d.requestPermission({mode:'readwrite'})}catch(e){p='denied'}if(p!=='granted')d=null}
  if(!d){d=await showDirectoryPicker({id:'wm-out',mode:'readwrite',startIn:'pictures'});saveDir=d;idb('readwrite',st=>st.put(d,'dir')).catch(()=>{})}
  return d;
}
async function writeTo(d,o){
  const base=o.name.replace(/\.[^.]+$/,''),ext=o.name.slice(base.length);let name=o.name,i=2;
  for(;;){try{await d.getFileHandle(name);name=`${base} (${i++})${ext}`}catch(e){break}}
  const fh=await d.getFileHandle(name,{create:true}),w=await fh.createWritable();await w.write(o.blob);await w.close();return name;
}
async function download(o){
  if(dl){try{await dl.save({filename:o.name,data:o.blob});return true}catch(e){if(e&&e.code==='declined')return false}}
  const u=URL.createObjectURL(o.blob),a=document.createElement('a');a.href=u;a.download=o.name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);return true;
}
async function saveSet(list,mode){ // mode: 'dir' | 'pick' | 'dl'
  if(mode!=='dl'){
    let d;try{d=await getDir(mode==='pick')}catch(e){if(e&&e.name!=='AbortError')toast('沒辦法打開資料夾，改用下載');else return 0;mode='dl'}
    if(d){let n=0;for(const o of list){try{await writeTo(d,o);n++}catch(e){toast('寫入失敗：'+(e.message||e.name));break}}
      if(n)toast(`已存 ${n} 個到「${d.name}」`);return n}
  }
  let n=0;for(const o of list){if(await download(o))n++;if(!dl&&list.length>1)await new Promise(r=>setTimeout(r,600))}
  if(n)toast(dl?`已儲存 ${n} 個`:`已存到「下載」資料夾（${n} 個）`);return n;
}
function resultView(){
  const outs=items.filter(i=>i.out),files=outs.map(i=>new File([i.out.blob],i.out.name,{type:i.out.blob.type}));
  let canShare=false;try{canShare=!!(navigator.canShare&&files.length&&navigator.canShare({files}))}catch(e){}
  const webm=outs.some(i=>i.out.ext==='webm'),many=outs.length>1,dis=outs.length?'':'disabled';
  const main=fsa?(saveDir?`<button class="pri" id="svDir" ${dis}>${ic('export')}存到「${esc(saveDir.name)}」</button><button id="svPick" ${dis}>${ic('addimg')}換資料夾</button>`
                          :`<button class="pri" id="svPick" ${dis}>${ic('export')}選擇資料夾儲存</button>`)
                 :`<button class="pri" id="svDl" ${dis}>${ic('export')}${many?'全部儲存':'儲存'}</button>`;
  card.innerHTML=`<h2>${cancel?'已停止':'完成了！'} ${outs.length} / ${items.length}</h2>
   <div class="acts">${main}</div>
   <div class="acts">${fsa?`<button id="svDl" ${dis}>${ic('export')}存到「下載」</button>`:''}${canShare?`<button id="shAll">${ic('share')}分享</button>`:''}</div>
   ${webm?'<p class="note">這個瀏覽器只能輸出 WebM 影片，Android 相簿可以播放。</p>':''}
   ${fsa?'<p class="note">選「Pictures」或「DCIM」裡的資料夾，相簿就看得到。下次會自動記住這個位置。</p>':''}
   <div class="list">${items.map((it,i)=>`<div class="it">${thumb(it)}<div><b>${esc(it.out?it.out.name:it.name)}</b><small class="${it.out?'ok':'bad'}">${it.out?size(it.out.blob):(it.err||'未處理')}</small></div>${it.out?`<button class="ib" data-s="${i}" aria-label="儲存這個檔案">${ic('export')}</button>`:'<span></span>'}</div>`).join('')}</div>
   <button id="cl">繼續編輯</button>`;
  $('#cl').onclick=close;
  const all=()=>outs.map(i=>i.out),re=()=>{if(fsa)resultView()};
  card.querySelectorAll('[data-s]').forEach(b=>b.onclick=async()=>{const n=await saveSet([items[+b.dataset.s].out],fsa?(saveDir?'dir':'pick'):'dl');if(n){b.innerHTML='✓';b.classList.add('on')}});
  if(!outs.length)return;
  const bind=(id,mode)=>{const b=$('#'+id);if(b)b.onclick=async()=>{const had=saveDir;await saveSet(all(),mode);if(saveDir!==had)re()}};
  bind('svDir','dir');bind('svPick','pick');bind('svDl','dl');
  if(canShare)$('#shAll').onclick=()=>navigator.share({files}).catch(()=>{});
}

/* ---------- installable app ---------- */
let instEvt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();instEvt=e;$('#inst').classList.remove('hide')});
$('#inst').addEventListener('click',async()=>{if(!instEvt)return;instEvt.prompt();try{await instEvt.userChoice}catch(e){}instEvt=null;$('#inst').classList.add('hide')});
window.addEventListener('appinstalled',()=>{$('#inst').classList.add('hide');toast('已安裝到主畫面')});
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&!window.claude)navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{})}catch(e){}

/* files shared in from the gallery (share_target) */
(async()=>{
  try{
    if(!new URLSearchParams(location.search).has('shared')||!window.caches)return;
    history.replaceState(null,'',location.pathname);
    const c=await caches.open('wm-share'),keys=await c.keys(),fs=[];
    for(const k of keys){const r=await c.match(k);if(!r)continue;const b=await r.blob();
      fs.push(new File([b],decodeURIComponent(r.headers.get('x-name')||'shared'),{type:r.headers.get('content-type')||b.type}))}
    await caches.delete('wm-share');
    if(fs.length){addFiles(fs);toast(`收到 ${fs.length} 個檔案`)}
  }catch(e){}
})();
}
</script>
